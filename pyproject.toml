[project]
name = "uberseek"
version = "0.0.1"
description = "A programmable environment for exploring video, for AI agents."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = ["pillow>=10.1"]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim>=2.71"]
sandbox = ["pydantic-monty>=1.6"]
transcript = ["faster-whisper>=1.1"]

[project.scripts]
uberseek = "uberseek.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pydantic-ai-slim[anthropic,openai]>=2.71", "pydantic-monty>=1.6", "faster-whisper>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uberseek"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
include = ["uberseek/**/*.py", "tests/**/*.py", "bench/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
