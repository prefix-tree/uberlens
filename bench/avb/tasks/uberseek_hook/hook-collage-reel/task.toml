version = "1.0"

[task]
name = "uberseek/hook-collage-reel"

[metadata]
category = "edit-analysis"
tags = ["collage", "hook", "timing"]
source = "a public Instagram reel; fetch with python -m bench.avb.hook fetch"

[materials]
# Files given to the agent in /workspace/materials/, by the name it sees: the path is from the repository root.
"reel.mp4" = "data/reference/collage-reel.mp4"

[environment]
cpus = 2
memory_mb = 4096
allow_internet = true

[[steps]]
name = "solve"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 120.0
