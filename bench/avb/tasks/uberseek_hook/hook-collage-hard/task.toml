version = "1.0"

[task]
name = "uberseek/hook-collage-hard"

[metadata]
category = "edit-analysis"
tags = ["collage", "hook", "timing"]
source = "generated by bench/avb/hook.py"
make = "python -m bench.avb.hook make"  # run from the repository root when the video is missing

[materials]
# Files given to the agent in /workspace/materials/, by the name it sees: the path is from the repository root.
"hook.mp4" = "bench/avb/tasks/uberseek_hook/hook-collage-hard/materials/hook.mp4"

[environment]
cpus = 2
memory_mb = 4096
allow_internet = true

[[steps]]
name = "solve"

[steps.agent]
timeout_sec = 900.0

[steps.verifier]
timeout_sec = 120.0
